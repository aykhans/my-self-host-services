- name: Home
  columns:
      - size: small
        widgets:
            - type: server-stats
              servers:
                  - type: local
                    name: Services

            - type: releases
              cache: 1d
              collapse-after: 5
              # Without authentication the Github API allows for up to 60 requests per hour. You can create a
              # read-only token from your Github account settings and use it here to increase the limit.
              token: ${GITHUB_TOKEN}
              repositories:
                  - caddyserver/caddy
                  - crowdsecurity/crowdsec
                  - dani-garcia/vaultwarden
                  - drakkan/sftpgo
                  - element-hq/synapse
                  - glanceapp/glance
                  - go-gitea/gitea
                  - grafana/grafana
                  - henrygd/beszel
                  - immich-app/immich
                  - louislam/uptime-kuma
                  - NLnetLabs/unbound
                  - schollz/croc
                  - stalwartlabs/stalwart
                  - TryGhost/Ghost
                  - usememos/memos
                  - VictoriaMetrics/VictoriaMetrics
                  - wg-easy/wg-easy

            - type: docker-containers
              cache: 0s
              hide-by-default: false

      - size: full
        widgets:
            - type: group
              widgets:
                  - type: lobsters
                  - type: hacker-news

            - type: rss
              limit: 150
              collapse-after: 5
              cache: 1h
              style: horizontal-cards
              feeds:
                  - url: https://selfh.st/rss/
                    title: selfh.st
                  - url: https://blog.tangled.org/feed.xml
                    title: tangled.org
                  - url: https://antonz.org/index.xml
                    title: antonz.org
                  - url: https://ganigeorgiev.com/meta/pocketbase/pocketbase/releases.atom
                    title: PocketBase releases

      - size: small
        widgets:
            - type: calendar
              first-day-of-week: monday

            - type: weather
              location: Baku, Azerbaijan
              units: metric # alternatively "imperial"
              hour-format: 12h # alternatively "24h"

            - type: markets
              markets:
                  - symbol: BTC-USD
                    name: Bitcoin
                  - symbol: SUI20947-USD
                    name: SUI
                  - symbol: ASTER36341-USD
                    name: ASTER
