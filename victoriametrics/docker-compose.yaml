networks:
  grafana:
    name: grafana
    driver: bridge
    external: true
  caddy:
    name: caddy
    driver: bridge
    external: true

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    container_name: victoriametrics
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - grafana
      - caddy
    command:
      - "--promscrape.config=/etc/victoriametrics/scrape.yaml"
      - "--retentionPeriod=90d"
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
    volumes:
      - ./data/config/scrape.yaml:/etc/victoriametrics/scrape.yaml:ro
      - victoriametrics-data:/victoria-metrics-data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  victoriametrics-data:
