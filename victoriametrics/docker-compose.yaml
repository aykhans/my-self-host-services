networks:
  metrics:
    external: false
  grafana:
    name: grafana
    driver: bridge
    external: true
  caddy:
    name: caddy
    driver: bridge
    external: true

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.154.0
    container_name: victoriametrics
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - metrics
      - grafana
      - caddy
    command:
      - "--promscrape.config=/etc/victoriametrics/scrape.yaml"
      - "--retentionPeriod=90d"
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
    volumes:
      - ./data/config/scrape.yaml:/etc/victoriametrics/scrape.yaml:ro
      - victoriametrics-data:/victoria-metrics-data
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  node_exporter:
    image: quay.io/prometheus/node-exporter:v1
    container_name: node_exporter
    restart: unless-stopped
    networks:
      - metrics
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - metrics
    volumes:
      - "/:/rootfs:ro"
      - "/var/run:/var/run:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"
    privileged: true
    devices:
      - "/dev/kmsg:/dev/kmsg"
    command:
      - -disable_metrics=advtcp,app,cpuLoad,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,network,oom_event,percpu,perf_event,pressure,process,referenced_memory,resctrl,sched,tcp,udp
      - -housekeeping_interval=3s
      - -storage_duration=2m
      - -docker_only
      - -containerd=/var/run/docker/containerd/containerd.sock
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  victoriametrics-data:
