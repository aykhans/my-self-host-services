global:
    scrape_interval: 10s

scrape_configs:
    - job_name: caddy
      scrape_interval: 2s
      static_configs:
          - targets: ["caddy:2019"]

    - job_name: crowdsec
      scrape_interval: 10s
      static_configs:
          - targets: ["crowdsec:6060"]

    - job_name: crowdsec_exporter
      scrape_interval: 30s
      static_configs:
          - targets: ["crowdsec_exporter:9100"]
