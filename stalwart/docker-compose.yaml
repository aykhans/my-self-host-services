networks:
  stalwart:
    external: false
  caddy:
    name: caddy
    driver: bridge
    external: true

services:
  stalwart:
    image: stalwartlabs/stalwart:v1.0.2
    container_name: stalwart
    restart: unless-stopped
    user: "1001:1001"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      stalwart: {}
      caddy:
        aliases:
          - mail.aykhans.me
    environment:
      STALWART_RECOVERY_ADMIN: "${STALWART_RECOVERY_ADMIN}"
      STALWART_HTTPS_PORT: "443"
      STALWART_CF_TOKEN: "${STALWART_CF_TOKEN}"
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "4190:4190"
      - "110:110"
      - "995:995"
    volumes:
      - ./data/etc:/etc/stalwart
      - ./data/var:/var/lib/stalwart
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
