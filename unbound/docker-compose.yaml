networks:
  caddy:
    name: caddy
    driver: bridge
    external: true

services:
  unbound:
    build: .
    container_name: unbound
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      - caddy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
